  <style>
    /* --- VARIABLES Y ESTILOS BASE --- */
    :root {
      --bg-main: #0a0c14;
      --bg-card: #141824;
      --bg-card-hover: #1c2235;
      --accent-cyan: #00f0ff;
      --accent-purple: #7000ff;
      --accent-green: #00ff88;
      --accent-yellow: #ffb703;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --border-color: #232a3e;
      --radius: 12px;
      --transition: all 0.3s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* --- HEADER --- */
    header {
      background-color: rgba(20, 24, 36, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
    }

    /* --- MAIN & HERO --- */
    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    .hero {
      text-align: center;
      padding: 2.5rem 1.5rem;
      background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg-main) 80%);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      margin-bottom: 2rem;
    }

    .hero h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
    }

    .hero p {
      color: var(--text-sub);
    }

    /* --- BUSCADOR --- */
    .search-section {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .search-box {
      width: 100%;
      padding: 1rem;
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: var(--transition);
    }

    .search-box:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    /* --- GRILLA DE JUEGOS --- */
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.2rem;
    }

    .game-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
      transition: var(--transition);
      cursor: pointer;
    }

    .game-card:hover {
      border-color: var(--accent-cyan);
      transform: translateY(-3px);
      background-color: var(--bg-card-hover);
      box-shadow: 0 4px 15px rgba(0, 240, 255, 0.1);
    }

    .game-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .badge-container {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .badge-label {
      font-size: 0.75rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-store {
      background-color: rgba(0, 255, 136, 0.1);
      color: var(--accent-green);
      border: 1px solid rgba(0, 255, 136, 0.2);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      display: inline-block;
    }

    .badge-mode {
      background-color: rgba(255, 183, 3, 0.1);
      color: var(--accent-yellow);
      border: 1px solid rgba(255, 183, 3, 0.2);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      display: inline-block;
    }

    .click-hint {
      font-size: 0.75rem;
      color: var(--accent-cyan);
      text-align: right;
      font-weight: 600;
    }

    /* --- MODAL DE REQUISITOS --- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 12, 20, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: var(--transition);
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-content {
      background-color: var(--bg-card);
      border: 1px solid var(--accent-cyan);
      border-radius: var(--radius);
      width: 90%;
      max-width: 600px;
      padding: 2rem;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.2);
      position: relative;
      transform: translateY(20px);
      transition: var(--transition);
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }

    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1.2rem;
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.8rem;
      cursor: pointer;
      transition: var(--transition);
    }

    .close-btn:hover {
      color: var(--accent-cyan);
    }

    .modal-title {
      font-size: 1.6rem;
      margin-bottom: 1rem;
      color: var(--text-main);
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    .req-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      margin-top: 1rem;
    }

    @media (min-width: 500px) {
      .req-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .req-box {
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
    }

    .req-box h4 {
      color: var(--accent-cyan);
      margin-bottom: 0.5rem;
      font-size: 1rem;
    }

    .req-box.rec h4 {
      color: var(--accent-green);
    }

    .req-box p {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 0.4rem;
    }

    .req-box strong {
      color: var(--text-main);
    }

    /* --- FOOTER --- */
    footer {
      background-color: var(--bg-card);
      border-top: 1px solid var(--border-color);
      padding: 1.5rem;
      text-align: center;
      color: var(--text-sub);
      font-size: 0.9rem;
      margin-top: auto;
    }

          min: { os: "Windows 7", cpu: "Intel Core 2 Duo E5200", ram: "4 GB", gpu: "GeForce 9800GTX+ (1GB)" },
          rec: { os: "Windows 10", cpu: "Intel Core i5", ram: "8 GB", gpu: "GeForce GTX 560+" }
        }
      },
      { 
        nombre: "Lethal Company", 
        tienda: "Steam (PC)", 
        modo: "Cooperativo con Amigos",
        req: {
          min: { os: "Windows 10 64-bit", cpu: "Intel Core i5-7400", ram: "4 GB", gpu: "NVIDIA GeForce GTX 1050" },
          rec: { os: "Windows 10 64-bit", cpu: "Intel Core i5-9400F", ram: "8 GB", gpu: "NVIDIA GeForce GTX 1660" }
        }
      }
    ];

    function mostrarJuegos(lista) {
      const grid = document.getElementById('results-grid');
      grid.innerHTML = '';

      if (lista.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 2rem; color: var(--text-sub);">
            <p>No se encontraron resultados para tu búsqueda.</p>
          </div>
        `;
        return;
      }

      lista.forEach((juego, index) => {
        const card = document.createElement('div');
        card.className = 'game-card';
        // Agregamos evento click para abrir los requisitos
        card.onclick = () => abrirModal(juego);

        card.innerHTML = `
          <div class="game-title">${juego.nombre}</div>
         
          <div class="badge-container">
            <div>
              <span class="badge-label">Disponible en:</span><br>
              <span class="badge-store">${juego.tienda}</span>
            </div>
            <div style="margin-top: 4px;">
              <span class="badge-label">Modo de Juego:</span><br>
              <span class="badge-mode">${juego.modo}</span>
            </div>
          </div>
          <div class="click-hint"> Ver requisitos ➔</div>
        `;
        grid.appendChild(card);
      });
    }

    function filtrarJuegos() {
      const texto = document.getElementById('searchInput').value.toLowerCase();
      const filtrados = catálogoJuegos.filter(juego =>
        juego.nombre.toLowerCase().includes(texto) ||
        juego.tienda.toLowerCase().includes(texto) ||
        juego.modo.toLowerCase().includes(texto)
      );
      mostrarJuegos(filtrados);
    }

    // Funciones para el Modal de Requisitos
    function abrirModal(juego) {
      document.getElementById('modalGameTitle').innerText = juego.nombre;
      
      // Llenar Mínimos
      document.getElementById('minOs').innerText = juego.req.min.os;
      document.getElementById('minCpu').innerText = juego.req.min.cpu;
      document.getElementById('minRam').innerText = juego.req.min.ram;
      document.getElementById('minGpu').innerText = juego.req.min.gpu;

      // Llenar Recomendados
      document.getElementById('recOs').innerText = juego.req.rec.os;
      document.getElementById('recCpu').innerText = juego.req.rec.cpu;
      document.getElementById('recRam').innerText = juego.req.rec.ram;
      document.getElementById('recGpu').innerText = juego.req.rec.gpu;

      // Mostrar modal
      document.getElementById('reqModal').classList.add('active');
    }

    function cerrarModal() {
      document.getElementById('reqModal').classList.remove('active');
    }

    function cerrarModalAfuera(e) {
      if (e.target.id === 'reqModal') {
        cerrarModal();
      }
    }

    // Inicializar lista
    document.addEventListener('DOMContentLoaded', () => mostrarJuegos(catálogoJuegos));
  </script>
</body>
</html>
